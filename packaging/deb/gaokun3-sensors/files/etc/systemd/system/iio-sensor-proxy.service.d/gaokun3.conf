[Unit]
# gaokun3: use the SSC build of the proxy and wait for the sensor DSP service
Wants=hexagonrpcd-sdsp.service
After=hexagonrpcd-sdsp.service
Before=gdm.service

[Service]
ExecStart=
ExecStart=/usr/libexec/iio-sensor-proxy-gaokun3
ExecStartPre=/bin/sh -c "for i in $(seq 1 40); do /usr/bin/qrtr-lookup 2>/dev/null | grep -q \"Sensor Core\" && exit 0; sleep 0.5; done; exit 1"
